kind = "web"
previewPath = "/"
title = "Coral Vozes da Vida"
version = "1.0.0"
id = "artifacts/coral-vozes-da-vida"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21922

[services.development]
run = "pnpm --filter @workspace/coral-vozes-da-vida run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/coral-vozes-da-vida", "run", "build" ]
publicDir = "artifacts/coral-vozes-da-vida/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21922"
BASE_PATH = "/"
